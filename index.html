<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Link</title>
    <style>
        /* Box styling */
        .link-box {
            width: 200px;
            padding: 20px;
            text-align: center;
            background-color: #007bff;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
        }
        .link-box:hover {
            background-color: #0056b3;
        }
        /* Hidden countdown */
        #countdown {
            display: none;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>

    <!-- Clickable Box for First Link -->
    <a id="dynamicLink" href="https://l.facebook.com/l.php?u=https%3A%2F%2Fwww.bsdkface.com%2FVEE3B4%3Futm_medium%3Dpaid%26utm_source%3Dig%26utm_id%3D120219406664530260%26utm_content%3D120219408538050260%26utm_term%3D120219408538150260%26utm_campaign%3D120219406664530260%26fbclid%3DPAY2xjawIOZYNleHRuA2FlbQIxMAABpp8DNI_LrwJvfNFQbaI5CTXbzYOC2n3YWrBLiRcqVxHAT3ZXd--VRe2OXQ_aem_cMsuZxPHV-rIGphOykHh7A&h=AT2CL0YVIc_uj3j7lQPZ25PZHgCyi823eucsrmKyzS93fv0cLPrtlI2fOy3_HLDIdGHJ76ftTSKZRUWMmLGahwARQDoEN_OSYI8S9OBC0a3Y3EdpLbfIIg" target="_blank" class="link-box">
        Agent link
    </a>

    <!-- Countdown (hidden initially) -->
    <p id="countdown"> <span id="time"></span> </p>

    <script>
        // Define the second link
        const link2 = "https://t.me/visalearning";
        const countdownElement = document.getElementById("countdown");
        const timeElement = document.getElementById("time");

        // Add click event listener to the first link
        document.getElementById("dynamicLink").addEventListener("click", function(event) {
            // Show countdown after clicking Link 1
            countdownElement.style.display = "hidden";

            let timeLeft = 15;
            timeElement.innerText = timeLeft; // Initial display

            const countdown = setInterval(() => {
                timeLeft--;
                timeElement.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    window.location.href = link2; // Redirect to second link
                }
            }, 1000);
        });
    </script>

</body>
</html>
